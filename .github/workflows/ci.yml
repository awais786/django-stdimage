name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:

  msgcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - uses: actions/checkout@v4
      - run: sudo apt install -y gettext aspell libenchant-2-dev
      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('lint-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - run: python -m pip install -r lint-requirements.txt
      - run: msgcheck -n stdimage/locale/*/LC_MESSAGES/*.po

  lint:
    strategy:
      fail-fast: false
      matrix:
        lint-command:
          - "bandit -r . -x ./tests"
          - "black --check --diff ."
          - "flake8 ."
          - "isort --check-only --diff ."
          - "pydocstyle ."
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - uses: actions/checkout@v4
      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('lint-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - run: python -m pip install -r lint-requirements.txt
      - run: ${{ matrix.lint-command }}

  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: sudo apt install gettext -y
      - run: python -m pip install --upgrade pip build wheel twine readme-renderer
      - run: python -m build --sdist --wheel
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          path: dist/*

  pytest:
    runs-on: ubuntu-latest
    needs:
      - lint
      - msgcheck
    strategy:
      fail-fast: false
      matrix:
        python_version:
          - "3.10"
        django_version:
          - "4.2"
          - "5.2"
        extra:
          - "test"
          - "test,progressbar"
    steps:
      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
      - run: sudo apt-get update && sudo apt-get install -y gettext
      - uses: actions/checkout@v4
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[${{ matrix.extra }}]
      - run: python -m pip install "Django~=${{ matrix.django_version }}.0"
      - run: pytest --maxfail=1 --disable-warnings -q
      - uses: codecov/codecov-action@v4


